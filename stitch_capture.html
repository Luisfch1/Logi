<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#25252c",
              "error": "#ff7351",
              "on-secondary-container": "#fff6f5",
              "error-container": "#b92902",
              "outline": "#76747b",
              "error-dim": "#d53d18",
              "primary-dim": "#beee00",
              "on-secondary-fixed-variant": "#a4002d",
              "surface-container-high": "#1f1f26",
              "primary-fixed": "#cafd00",
              "on-tertiary-container": "#004d57",
              "secondary": "#ff6f7c",
              "surface-container-low": "#131318",
              "surface-container": "#19191f",
              "inverse-on-surface": "#55545a",
              "on-secondary": "#49000f",
              "secondary-fixed": "#ffc3c4",
              "on-primary-fixed": "#3a4a00",
              "on-error-container": "#ffd2c8",
              "secondary-fixed-dim": "#ffaeb2",
              "on-error": "#450900",
              "on-primary-container": "#4a5e00",
              "surface-tint": "#f3ffca",
              "inverse-surface": "#fbf8ff",
              "on-surface-variant": "#acaab1",
              "on-primary-fixed-variant": "#526900",
              "primary-container": "#cafd00",
              "surface-dim": "#0e0e13",
              "on-secondary-fixed": "#6f001b",
              "on-background": "#f6f2fa",
              "tertiary-dim": "#00d4ec",
              "surface-bright": "#2b2b33",
              "primary": "#f3ffca",
              "tertiary-fixed-dim": "#00d4ec",
              "on-tertiary-fixed": "#003840",
              "surface": "#0e0e13",
              "inverse-primary": "#516700",
              "on-tertiary": "#005762",
              "tertiary-fixed": "#00e3fd",
              "secondary-container": "#be0036",
              "on-tertiary-fixed-variant": "#005762",
              "background": "#0e0e13",
              "tertiary-container": "#00e3fd",
              "tertiary": "#81ecff",
              "surface-container-lowest": "#000000",
              "secondary-dim": "#e51245",
              "surface-container-highest": "#25252c",
              "on-surface": "#f6f2fa",
              "on-primary": "#516700",
              "primary-fixed-dim": "#beee00",
              "outline-variant": "#48474d"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(25, 25, 31, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(243, 255, 202, 0.08);
        }
        .neon-glow-text {
            text-shadow: 0 0 10px rgba(202, 253, 0, 0.4);
        }
        .white-glow-text {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
        .neon-corner {
            width: 32px;
            height: 32px;
            border-color: #cafd00;
            filter: drop-shadow(0 0 8px rgba(202, 253, 0, 0.6));
        }
        body {
            min-height: 100dvh;
            height: 100dvh;
        }
    </style>
</head>
<body class="bg-[#0e0e13] font-body text-on-surface overflow-hidden flex flex-col">
<!-- TopAppBar -->
<header class="w-full z-50 px-6 py-4 flex justify-between items-center bg-[#0e0e13]/80 backdrop-blur-xl border-b border-[#f3ffca]/10">
<div class="flex items-center gap-3 cursor-pointer group">
<h1 class="font-['Space_Grotesk'] font-bold tracking-tighter uppercase text-base text-[#CCFF00] neon-glow-text">LOGI</h1>
<span class="material-symbols-outlined text-white text-lg" data-icon="chevron_right">chevron_right</span>
<span class="font-['Space_Grotesk'] font-medium tracking-tight uppercase text-xs text-white white-glow-text">PROYECTO PRINCIPAL</span>
</div>
</header>
<main class="relative flex-1 w-full overflow-hidden flex flex-col" style="background-color: #000000;">
<!-- Framing Area (70% Height) -->
<div class="h-[70%] w-full relative absolute inset-0 flex items-center justify-center">
<!-- Framing Corners -->
<div class="relative w-full max-w-4xl aspect-[4/3] z-10 pointer-events-none flex flex-col justify-between p-10">
<div class="flex justify-between w-full">
<div class="neon-corner border-t-4 border-l-4 rounded-tl-lg"></div>
<div class="neon-corner border-t-4 border-r-4 rounded-tr-lg"></div>
</div>
<div class="flex justify-between w-full">
<div class="neon-corner border-b-4 border-l-4 rounded-bl-lg"></div>
<div class="neon-corner border-b-4 border-r-4 rounded-br-lg"></div>
</div>
</div>
<!-- Empty Viewport for ultra-clean look -->
<div class="absolute inset-0" style="background-color: #000000;"></div>
</div>
<!-- Action Layer (Pinned to Bottom) -->
<div class="absolute bottom-0 left-0 w-full px-4 pb-4 z-40">
<div class="max-w-md mx-auto glass-card rounded-3xl p-4 shadow-2xl space-y-3">
<!-- ROW 1: Capture, Activity, Share -->
<div class="flex items-center gap-3">
<!-- Neon Capture Circle -->
<button class="shrink-0 w-12 h-12 rounded-full bg-primary-fixed shadow-[0_0_20px_rgba(202,253,0,0.6)] active:scale-90 transition-all flex items-center justify-center">
<div class="w-10 h-10 rounded-full border-2 border-on-primary-fixed/30"></div>
</button>
<!-- Item/Activity Selector -->
<div class="flex-1 bg-surface-container-high/40 h-12 rounded-xl border border-outline-variant/20 flex items-center justify-between px-4 cursor-pointer hover:bg-surface-container-highest/60 transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="list">list</span>
<span class="font-headline font-semibold text-[10px] uppercase tracking-wider text-on-surface">Cimentación Fase 2</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="expand_more">expand_more</span>
</div>
<!-- Share Icon -->
<button class="shrink-0 w-12 h-12 rounded-xl bg-surface-container-high/40 border border-outline-variant/20 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="share">share</span>
</button>
</div>
<!-- ROW 2: Input & Mic Combined -->
<div class="relative flex items-center">
<div class="relative w-full">
<input class="w-full bg-surface-container-low/40 border-none rounded-xl h-12 pl-4 pr-12 text-xs font-body tracking-wide placeholder:text-on-surface-variant/40 focus:ring-1 focus:ring-primary/30 transition-all" placeholder="AÑADIR DESCRIPCIÓN TÉCNICA..." type="text"/>
<button class="absolute right-0 top-0 w-12 h-12 flex items-center justify-center text-primary/80 hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="w-full z-50 flex justify-around items-center px-2 pb-6 pt-2 bg-[#0e0e13] border-t border-[#f3ffca]/10 rounded-t-2xl">
<!-- Capture Tab -->
<a class="flex flex-col items-center justify-center text-[#cafd00] bg-[#cafd00]/10 rounded-xl px-4 py-2" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</a>
<!-- Gallery Tab -->
<a class="flex flex-col items-center justify-center text-slate-500 opacity-60 hover:text-[#f3ffca] hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="grid_view">grid_view</span>
</a>
<!-- Export Tab -->
<a class="flex flex-col items-center justify-center text-slate-500 opacity-60 hover:text-[#f3ffca] hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="ios_share">ios_share</span>
</a>
<!-- Reports Tab -->
<a class="flex flex-col items-center justify-center text-slate-500 opacity-60 hover:text-[#f3ffca] hover:opacity-100 transition-all" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="analytics">analytics</span>
</a>
</nav>
</body></html>
